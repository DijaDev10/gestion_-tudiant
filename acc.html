                <span>Ouvrir l'application</span>

            </a>
        </div>
    </div>

    <script>
        (function () {
            const CLE_THEME = "themeUNCHK";
            const btnTheme = document.getElementById("btnThemeAccueil");
            const iconeTheme = btnTheme.querySelector("i");
            const btnEntrer = document.getElementById("btnEntrerFormulaire");

            if (btnEntrer) {
                btnEntrer.addEventListener("click", function () {
                    sessionStorage.setItem("accesFormulaireUNCHK", "true");
                });
            }

            function appliquerTheme(mode) {
                if (mode === "sombre") {
                    document.body.classList.add("sombre");
                    iconeTheme.className = "fa-solid fa-sun";
                    btnTheme.title = "Mode clair";
                } else {
                    document.body.classList.remove("sombre");
                    iconeTheme.className = "fa-solid fa-moon";
                    btnTheme.title = "Mode sombre";
                }
            }

            try {
                const modeSauvegarde = localStorage.getItem(CLE_THEME);
                appliquerTheme(modeSauvegarde === "sombre" ? "sombre" : "clair");
            } catch (e) {
                appliquerTheme("clair");
            }

            btnTheme.addEventListener("click", function () {
                const modeActuel = document.body.classList.contains("sombre") ? "sombre" : "clair";
                const nouveauMode = modeActuel === "sombre" ? "clair" : "sombre";
                try {
                    localStorage.setItem(CLE_THEME, nouveauMode);
                } catch (e) {}
                appliquerTheme(nouveauMode);
            });
        })();
    </script>
